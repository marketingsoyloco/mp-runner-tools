name: run
on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      mode: { description: 'mode', required: false, default: 'incremental' }
      job_id: { description: 'job id', required: false }
concurrency: { group: run, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # Cada grupo num job próprio = VM própria = IP próprio. O alvo bloqueia
      # por IP depois de uma raspagem longa; em sequência, as partes seguintes
      # herdavam o IP já marcado e morriam em 1s. fail-fast off: um grupo
      # bloqueado não derruba os outros.
      fail-fast: false
      max-parallel: 5
      matrix:
        group: ['1ab', '1cd', '2ab', '3ab', '3cd']
    steps:
      - name: Checkout tools
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CONTENT_REPO }}
          token: ${{ secrets.GH_CONTENT_TOKEN }}
          path: work
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install
        run: |
          pip install -q -r work/scraper/requirements.txt
          # Output stays suppressed (public log), but a failed browser install
          # must not be silent — sem isto ele só aparece como "fail in 1s".
          if ! python -m playwright install --with-deps chromium > /dev/null 2>&1; then
            echo "browser_install_failed"
            exit 1
          fi
      - name: Run
        env:
          TARGET_BASE_URL: ${{ secrets.TARGET_BASE_URL }}
          DATA_API_URL:    ${{ secrets.DATA_API_URL }}
          DATA_API_KEY:    ${{ secrets.DATA_API_KEY }}
          # Sem esta linha o secret existe no GitHub e é INVISÍVEL para o
          # script — foi exatamente o que manteve o 401 do portão de JWT.
          DATA_API_BEARER: ${{ secrets.DATA_API_BEARER }}
        # job_id compartilhado entre os jobs da matriz (o script sufixa com o
        # grupo), para o admin conseguir agrupar as partes de um mesmo run.
        run: >
          python work/scraper/scrape.py
          --mode "${{ inputs.mode || 'incremental' }}"
          --job "${{ inputs.job_id || github.run_id }}"
          --group "${{ matrix.group }}"

name: run
on:
  schedule:
    - cron: "23 */2 * * *"
  workflow_dispatch:
    inputs:
      mode: { description: 'mode', required: false, default: 'incremental' }
      job_id: { description: 'job id', required: false }
      # Retry surgical scope: only these matrix groups run. Empty = all.
      groups: { description: 'comma-separated groups (empty = all)', required: false, default: '' }
      # Bounded self-retry counter. Never set by hand.
      attempt: { description: 'retry attempt (internal)', required: false, default: '0' }
concurrency: { group: run, cancel-in-progress: false }
permissions: { contents: read }
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.g.outputs.groups }}
    steps:
      - id: g
        env:
          RAW: ${{ inputs.groups }}
        run: |
          DEFAULT='1ab,1cd,2ab,3ab,3cd'
          LIST="${RAW:-$DEFAULT}"
          JSON=$(printf '%s' "$LIST" | python3 -c "import sys,json;print(json.dumps([g.strip() for g in sys.stdin.read().split(',') if g.strip()]))")
          echo "groups=$JSON" >> "$GITHUB_OUTPUT"
  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # Cada grupo num job próprio = VM própria = IP próprio. O alvo bloqueia
      # por IP depois de uma raspagem longa; em sequência, as partes seguintes
      # herdavam o IP já marcado e morriam em 1s. fail-fast off: um grupo
      # bloqueado não derruba os outros.
      fail-fast: false
      max-parallel: 5
      matrix:
        group: ${{ fromJSON(needs.plan.outputs.groups) }}
    steps:
      - name: Checkout tools
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.CONTENT_REPO }}
          token: ${{ secrets.GH_CONTENT_TOKEN }}
          path: work
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install
        run: |
          pip install -q -r work/scraper/requirements.txt
          # Output stays suppressed (public log), but a failed browser install
          # must not be silent — sem isto ele só aparece como "fail in 1s".
          if ! python -m playwright install --with-deps chromium > /dev/null 2>&1; then
            echo "browser_install_failed"
            exit 1
          fi
      - name: Run
        env:
          TARGET_BASE_URL: ${{ secrets.TARGET_BASE_URL }}
          DATA_API_URL:    ${{ secrets.DATA_API_URL }}
          DATA_API_KEY:    ${{ secrets.DATA_API_KEY }}
          # Sem esta linha o secret existe no GitHub e é INVISÍVEL para o
          # script — foi exatamente o que manteve o 401 do portão de JWT.
          DATA_API_BEARER: ${{ secrets.DATA_API_BEARER }}
        # job_id compartilhado entre os jobs da matriz (o script sufixa com o
        # grupo), para o admin conseguir agrupar as partes de um mesmo run.
        run: >
          python work/scraper/scrape.py
          --mode "${{ inputs.mode || 'incremental' }}"
          --job "${{ inputs.job_id || github.run_id }}"
          --group "${{ matrix.group }}"
  # Bounded self-retry: re-dispatch ONLY the failed groups, with exponential
  # backoff + jitter, capped at 3 attempts. After the cap, the next scheduled
  # run is the retry. workflow_dispatch is exempt from the GITHUB_TOKEN
  # recursion guard, so no extra PAT is needed.
  retry:
    needs: run
    if: ${{ !cancelled() && needs.run.result == 'failure' && fromJSON(inputs.attempt || '0') < 3 }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions: { actions: write, contents: read }
    steps:
      - name: Re-dispatch failed groups
        env:
          GH_TOKEN: ${{ github.token }}
          ATTEMPT: ${{ inputs.attempt || '0' }}
          MODE: ${{ inputs.mode || 'incremental' }}
        run: |
          FAILED=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.name | startswith("run (")) | select(.conclusion == "failure") | .name | capture("run .(?<g>[^)]+).").g] | join(",")')
          if [ -z "$FAILED" ]; then
            echo "no failed groups resolved; nothing to retry"
            exit 0
          fi
          NEXT=$((ATTEMPT + 1))
          # 5-8 min, 10-13 min, 20-23 min. Blocked IPs need distance, not haste.
          SLEEP=$(( 300 * (2 ** ATTEMPT) + RANDOM % 180 ))
          echo "retry $NEXT for groups [$FAILED] after ${SLEEP}s"
          sleep "$SLEEP"
          gh workflow run run.yml \
            -f mode="$MODE" \
            -f groups="$FAILED" \
            -f attempt="$NEXT"
